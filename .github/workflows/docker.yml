name: Docker

on:
  workflow_dispatch:
  push:
  schedule: # Minute Hour Date Month Weekday
    - cron: "0 16 1 * *" # Run on the 1st of every month at 16:00 AM UTC +8 --> 0:00 AM CST

permissions:
  contents: read

env:
  IMAGE: kaunghl98/wagent

jobs:
  build-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: BUILDKIT_INLINE_CACHE=1

      - name: Smoke test (pull & run)
        if: github.ref == 'refs/heads/master'
        run: |
          docker pull ${{ env.IMAGE }}:latest --platform linux/amd64
          make test

  docs:
    name: Update Docker Hub description
    needs: build-publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}